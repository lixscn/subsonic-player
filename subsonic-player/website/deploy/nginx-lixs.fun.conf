# lixs.fun / www.lixs.fun —— Subsonic Player 落地页（静态站）
#
# 背景：443 由 nginx.conf 的 stream 段按 SNI 分流（ssl_preread），默认经 8445 注入 PROXY protocol
#      转发到 8444，因此 HTTPS 的 server 块监听的是 8444 ssl proxy_protocol。
# 证书：由 certbot 签发，目录 /etc/letsencrypt/live/lixs.fun/

# ---------- HTTP：ACME 验证 + 跳转 HTTPS ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name lixs.fun www.lixs.fun _;

    root /var/www/lixs.fun;

    # Let's Encrypt 验证目录：必须在跳转之前，且不能被重定向
    location /.well-known/acme-challenge/ {
        root /var/www/lixs.fun;
    }

    location / {
        return 301 https://www.lixs.fun$request_uri;
    }
}

# ---------- HTTPS（经 stream 的 PROXY protocol 进来）----------
server {
    listen 8444 ssl proxy_protocol;
    listen [::]:8444 ssl proxy_protocol;
    server_name lixs.fun www.lixs.fun;

    root /var/www/lixs.fun;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/lixs.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lixs.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml;

    # 图片/样式：长缓存
    location ~* \.(jpg|jpeg|png|svg|ico|css|js|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 安装包：支持断点续传，缓存 7 天
    location /downloads/ {
        add_header Accept-Ranges bytes;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/lixs.fun.access.log;
    error_log  /var/log/nginx/lixs.fun.error.log;
}
