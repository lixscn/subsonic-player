name: Build

# CI：每次 push/PR 在真实目标 OS 上编译+发布验证；打 v* tag 时自动发版（GitHub Release 挂载三平台 zip）。
#
# 关键点：
#   - 每 OS 显式 restore/build/publish 且带 -r <rid>：
#       Windows 用 `-r win-x64`（裸还原，避免 -p:TargetFramework 传播到 Core）
#       Linux/macOS 用 `-p:TargetFramework=net10.0 -r <rid>`（限定当前 TFM，避免还原 net10.0-windows 专属 TFM）
#   - macOS runner 是 arm64，但 BASS/CEF 原生为 x64 → 必须 -r osx-x64，否则找不到 libEGL/libGLESv2/libvk_swiftshader。
#   - 发布目录（bin/Release/<tfm>/<rid>/）整体作为 artifact 上传；发版 job 下载后统一打成 <rid>.zip。
#
# 说明：Android（SubsonicPlayer.Mobile）为 P6 占位工程未接入；settings.json 未提交仓库。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tfm: net10.0-windows10.0.19041.0
            rid: win-x64
            restore: dotnet restore src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -r win-x64
            build: dotnet build src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -f net10.0-windows10.0.19041.0 -r win-x64 --no-restore -nologo
            publish: dotnet publish src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true --no-restore -nologo -p:PublishSingleFile=true
          - os: ubuntu-latest
            tfm: net10.0
            rid: linux-x64
            restore: dotnet restore src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -p:TargetFramework=net10.0 -r linux-x64
            build: dotnet build src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -f net10.0 -r linux-x64 --no-restore -nologo
            publish: dotnet publish src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -c Release -f net10.0 -r linux-x64 --self-contained true --no-restore -nologo
          - os: macos-latest
            tfm: net10.0
            rid: osx-x64
            restore: dotnet restore src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -p:TargetFramework=net10.0 -r osx-x64
            build: dotnet build src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -f net10.0 -r osx-x64 --no-restore -nologo
            publish: dotnet publish src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -c Release -f net10.0 -r osx-x64 --self-contained true --no-restore -nologo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: dotnet
        run: ${{ matrix.restore }}

      - name: Build (compile gate)
        working-directory: dotnet
        run: ${{ matrix.build }}

      - name: Publish self-contained
        working-directory: dotnet
        run: ${{ matrix.publish }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubsonicPlayer-${{ matrix.rid }}
          path: |
            dotnet/src/SubsonicPlayer.Cef/bin/Release/${{ matrix.tfm }}/${{ matrix.rid }}/
            dotnet/src/SubsonicPlayer.Cef/bin/Release/${{ matrix.tfm }}/CefGlueBrowserProcess/
          if-no-files-found: ignore

  release:
    # 打 v* tag 时触发：等 build 矩阵完成后，把各平台打包成 zip 并创建 GitHub Release。
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: SubsonicPlayer-*

      - name: Package zips
        working-directory: release
        run: |
          for d in SubsonicPlayer-*/; do
            if [ -d "$d" ]; then
              (cd "$d" && zip -qr "../$(basename "$d").zip" .)
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/SubsonicPlayer-*.zip
