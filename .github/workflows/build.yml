name: Build

# CI 真机 workflow：每次 push / PR 在真实目标 OS 上编译并发布，验证跨平台代码。
# 用矩阵（matrix）分别在 Windows / Ubuntu / macOS 官方 runner 上跑。
#
# 关键点：
#   - 每 OS 显式 restore/build（含 RID）：Restore 用 -p:TargetFramework=<tfm> 限定当前 TFM，
#     避免 Linux/macOS 去还原 Cef 的 net10.0-windows 专属 TFM；macOS 因 runner 是 arm64 而
#     BASS/CEF 原生为 x64，必须 -r osx-x64（默认 RID=osx-arm64 会找不到 libEGL/libGLESv2 等）。
#   - Publish self-contained 对 CefGlue 跨平台打包在 CI 上尚不稳定，设 continue-on-error；
#     正式发布包仍走本地 dotnet/publish.ps1。
#
# 说明：Android（SubsonicPlayer.Mobile）为 P6 占位工程未接入；settings.json 未提交仓库。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tfm: net10.0-windows10.0.19041.0
            rid: win-x64
            restore: dotnet restore src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj
            build: dotnet build src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -f net10.0-windows10.0.19041.0 --no-restore -nologo
            publish: dotnet publish src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true --no-restore -nologo
            continue: false
          - os: ubuntu-latest
            tfm: net10.0
            rid: linux-x64
            restore: dotnet restore src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -p:TargetFramework=net10.0 -r linux-x64
            build: dotnet build src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -f net10.0 -r linux-x64 --no-restore -nologo
            publish: dotnet publish src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -c Release -f net10.0 -r linux-x64 --self-contained true --no-restore -nologo
            continue: false
          - os: macos-latest
            tfm: net10.0
            rid: osx-x64
            restore: dotnet restore src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -p:TargetFramework=net10.0 -r osx-x64
            build: dotnet build src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -f net10.0 -r osx-x64 --no-restore -nologo
            publish: dotnet publish src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -c Release -f net10.0 -r osx-x64 --self-contained true --no-restore -nologo
            continue: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: dotnet
        run: ${{ matrix.restore }}

      - name: Build (compile gate)
        working-directory: dotnet
        run: ${{ matrix.build }}

      - name: Publish self-contained (best effort)
        continue-on-error: true
        working-directory: dotnet
        run: ${{ matrix.publish }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SubsonicPlayer-${{ matrix.rid }}
          path: |
            dotnet/src/SubsonicPlayer.Cef/bin/Release/${{ matrix.tfm }}/${{ matrix.rid }}/
            dotnet/src/SubsonicPlayer.Cef/bin/Release/${{ matrix.tfm }}/CefGlueBrowserProcess/
          if-no-files-found: ignore
