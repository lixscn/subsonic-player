name: Build

# CI锛氭瘡娆?push/PR 鍦ㄧ湡瀹炵洰鏍?OS 涓婄紪璇?鍙戝竷楠岃瘉锛涙墦 v* tag 鏃惰嚜鍔ㄥ彂鐗堬紙GitHub Release 鎸傝浇涓夊钩鍙?zip锛夈€?#
# 鍏抽敭鐐癸細
#   - 姣?OS 鏄惧紡 restore/build/publish 涓斿甫 -r <rid>锛?#       Windows 鐢?`-r win-x64`锛堣８杩樺師锛岄伩鍏?-p:TargetFramework 浼犳挱鍒?Core锛?#       Linux/macOS 鐢?`-p:TargetFramework=net10.0 -r <rid>`锛堥檺瀹氬綋鍓?TFM锛岄伩鍏嶈繕鍘?net10.0-windows 涓撳睘 TFM锛?#   - macOS runner 鏄?arm64锛屼絾 BASS/CEF 鍘熺敓涓?x64 鈫?蹇呴』 -r osx-x64锛屽惁鍒欐壘涓嶅埌 libEGL/libGLESv2/libvk_swiftshader銆?#   - 鍙戝竷鐩綍锛坆in/Release/<tfm>/<rid>/锛夋暣浣撲綔涓?artifact 涓婁紶锛涘彂鐗?job 涓嬭浇鍚庣粺涓€鎵撴垚 <rid>.zip銆?#
# 璇存槑锛欰ndroid锛圫ubsonicPlayer.Mobile锛変负 P6 鍗犱綅宸ョ▼鏈帴鍏ワ紱settings.json 鏈彁浜や粨搴撱€?
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tfm: net10.0-windows10.0.19041.0
            rid: win-x64
            restore: dotnet restore src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -r win-x64
            build: dotnet build src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -f net10.0-windows10.0.19041.0 -r win-x64 --no-restore -nologo
            publish: dotnet publish src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true --no-restore -nologo
          - os: ubuntu-latest
            tfm: net10.0
            rid: linux-x64
            restore: dotnet restore src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -p:TargetFramework=net10.0 -r linux-x64
            build: dotnet build src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -f net10.0 -r linux-x64 --no-restore -nologo
            publish: dotnet publish src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -c Release -f net10.0 -r linux-x64 --self-contained true --no-restore -nologo
          - os: macos-latest
            tfm: net10.0
            rid: osx-x64
            restore: dotnet restore src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -p:TargetFramework=net10.0 -r osx-x64
            build: dotnet build src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -f net10.0 -r osx-x64 --no-restore -nologo
            publish: dotnet publish src/SubsonicPlayer.Cef/SubsonicPlayer.Cef.csproj -c Release -f net10.0 -r osx-x64 --self-contained true --no-restore -nologo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: dotnet
        run: ${{ matrix.restore }}

      - name: Build (compile gate)
        working-directory: dotnet
        run: ${{ matrix.build }}

      - name: Publish self-contained
        working-directory: dotnet
        run: ${{ matrix.publish }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubsonicPlayer-${{ matrix.rid }}
          path: |
            dotnet/src/SubsonicPlayer.Cef/bin/Release/${{ matrix.tfm }}/${{ matrix.rid }}/
            dotnet/src/SubsonicPlayer.Cef/bin/Release/${{ matrix.tfm }}/CefGlueBrowserProcess/
          if-no-files-found: ignore

  release:
    # 鎵?v* tag 鏃惰Е鍙戯細绛?build 鐭╅樀瀹屾垚鍚庯紝鎶婂悇骞冲彴鎵撳寘鎴?zip 骞跺垱寤?GitHub Release銆?    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: SubsonicPlayer-*

      - name: Package zips
        working-directory: release
        run: |
          for d in SubsonicPlayer-*/; do
            if [ -d "$d" ]; then
              (cd "$d" && zip -qr "../$(basename "$d").zip" .)
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/SubsonicPlayer-*.zip
